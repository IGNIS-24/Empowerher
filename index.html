<html>
    <head>
        <title>REGISTRTION FORM</title>
    </head>
<h2>SIGN UP</h2>
<body>
<form action="/submit form">NAME:
<label for="name"><NAME:</label><input type="text"id="name" name="name"  required>
<br><br>
<label for="email">EMAIL:</label><input type="text" name="email" id="email" required>
<br><br>
<label for="address">ADDRESS:</label><input type="text" name="address" id="address" required>
<br><br>
<label for="dob">DATE OF BIRTH:</label><input type="text"id="dob"name="dob" required>
<br><br>
<label for="gender">GENDER:</label><input type="radio" id="male"name="gender"value="male"><label for="male">Male</label><input type="radio" id="female"name="gender"value="female"><label for="female">Female</label>
<br><br>
<label for="phone">PHONE NUMBER:</label><input type="tel" id="phone"name="phone"required>
<br><br>
<input type="submit"value="Submit">
    </form>
</body>
</html>
